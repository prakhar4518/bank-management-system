name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [11, 17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile
        run: |
          mkdir out
          javac -Xlint:all -d out $(find src -name '*.java')
      - name: Smoke test (start and exit)
        run: printf '4\n' | java -cp out bank.Main
